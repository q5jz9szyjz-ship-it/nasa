
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NASA Space Explorer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>NASA Space Explorer</h1>
    <p>Explore the universe with NASA!</p>
  </header>

  <main>
    <section class="intro">
      <h2>Astronomy Picture of the Day</h2>
      <p>
        Choose your dates to see amazing space pictures
        from NASA.
      </p>
    </section>

    <section class="search">
      <form id="dateForm">
        <label for="startDate">Start Date:</label>
        <input type="date" id="startDate" required>

        <label for="endDate">End Date:</label>
        <input type="date" id="endDate" required>

        <button type="submit">Show Pictures</button>
      </form>
    </section>

    <p id="loading" hidden>Loading space pictures...</p>
    <p id="error" role="alert"></p>

    <section id="gallery" class="gallery"></section>

    <section class="facts">
      <h2>Did You Know?</h2>
      <p id="fact"></p>
      <button id="factButton">New Space Fact</button>
    </section>
  </main>

  <div id="modal" class="modal" hidden>
    <div class="modal-box">
      <button id="closeButton">X</button>
      <div id="modalImage"></div>
      <h2 id="modalTitle"></h2>
      <p id="modalDate"></p>
      <p id="modalText"></p>
    </div>
  </div>

  <footer>
    <p>NASA Space Explorer Project</p>
    <p>Pictures provided by NASA APOD API</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
